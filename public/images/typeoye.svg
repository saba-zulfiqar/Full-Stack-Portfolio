<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="typebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="keyboard-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#typebg)" />
  <g transform="translate(150, 80)">
    <!-- Browser window mockup -->
    <rect width="500" height="290" rx="16" fill="#1f2937" stroke="#374151" stroke-width="2" />
    <rect width="500" height="40" rx="16" fill="#111827" />
    <circle cx="25" cy="20" r="5" fill="#ef4444" />
    <circle cx="45" cy="20" r="5" fill="#f59e0b" />
    <circle cx="65" cy="20" r="5" fill="#10b981" />
    <rect x="110" y="10" width="280" height="20" rx="10" fill="#374151" opacity="0.6" />
    <text x="250" y="24" fill="#9ca3af" font-family="system-ui" font-size="11" text-anchor="middle">typeoye.com</text>

    <!-- Content: Typing speed test UI -->
    <text x="250" y="90" fill="url(#keyboard-accent)" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">TypeOye</text>
    <text x="250" y="120" fill="#9ca3af" font-family="system-ui" font-size="14" text-anchor="middle">Interactive Touch Typing &amp; Speed Platform</text>
    
    <rect x="50" y="150" width="400" height="80" rx="10" fill="#111827" stroke="#374151" />
    <text x="70" y="185" fill="#e2e8f0" font-family="monospace" font-size="14">the quick brown fox jumps over the lazy dog</text>
    <rect x="360" y="172" width="2" height="16" fill="#38bdf8" />

    <!-- Metric boxes -->
    <g transform="translate(80, 240)">
      <rect width="100" height="30" rx="6" fill="#374151" opacity="0.4" />
      <text x="50" y="20" fill="#38bdf8" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">85 WPM</text>
    </g>
    <g transform="translate(200, 240)">
      <rect width="100" height="30" rx="6" fill="#374151" opacity="0.4" />
      <text x="50" y="20" fill="#10b981" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">98.5% ACC</text>
    </g>
    <g transform="translate(320, 240)">
      <rect width="100" height="30" rx="6" fill="#374151" opacity="0.4" />
      <text x="50" y="20" fill="#f43f5e" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">60 SEC</text>
    </g>
  </g>
</svg>
